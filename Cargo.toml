# SOURCE: <https://doc.rust-lang.org/cargo/reference/workspaces.html#the-workspace-section>
[workspace]
members = ["arbiter", "ramus"]
resolver = "2"

# SOURCE: <https://doc.rust-lang.org/cargo/reference/profiles.html#bench>
[profile.bench]
inherits = "release"
debug = "full"

# SOURCE: <https://doc.rust-lang.org/cargo/reference/profiles.html#dev>
[profile.dev]
debug = 0

# SOURCE: <https://doc.rust-lang.org/cargo/reference/profiles.html#release>
[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
