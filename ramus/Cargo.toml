# SOURCE: <https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html>
[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

# SOURCE: <https://doc.rust-lang.org/cargo/reference/features.html>
[features]
parallel = []
serde = ["dep:serde"]

# SOURCE: <https://doc.rust-lang.org/cargo/reference/manifest.html#the-package-section>
[package]
authors = ["Kirill Bezuglyi <fidelicura@gmail.com>", "et al."]
categories = ["simulation", "emulation", "algorithms"]
description = "Trace-driven branch predictor evaluation framework for research and simulation"
documentation = "https://docs.rs/ramus"
edition = "2024"
rust-version = "1.98"
homepage = "https://github.com/fidelicura/ramus"
license = "Apache-2.0"
name = "ramus"
readme = "README.md"
repository = "https://github.com/fidelicura/ramus"
version = "0.0.0"

# SOURCE: <https://doc.rust-lang.org/cargo/reference/profiles.html#bench>
[profile.bench]
inherits = "release"
debug = "full"

# SOURCE: <https://doc.rust-lang.org/cargo/reference/profiles.html#dev>
[profile.dev]
debug = 0

# SOURCE: <https://doc.rust-lang.org/cargo/reference/profiles.html#release>
[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
